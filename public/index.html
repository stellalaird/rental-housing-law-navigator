<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental Housing Law Navigator</title>
<style>
/* Direction: editorial / legal-document. See DESIGN.md. System fonts only (offline). One ink accent; status colours appear only on stamps and card rules. */
:root{--bg:#f3efe6;--surface:#fbf9f3;--fg:#1b1a17;--mut:#5f5b50;--faint:#8c8778;--line:#d8d2c2;--line2:#bdb6a2;--ink:#1b1a17;--on-ink:#f3efe6;--warn:#fff3cf;--warnb:#b07d00;
 --applies:#0b6b45;--unknown:#8a5a00;--superseded:#5b3fa0;--future:#0a5ea8;--pending:#6b6a78;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:40px;--s7:72px;
 --t-xs:11.5px;--t-sm:13.5px;--t-base:15.5px;--t-lg:19px;--t-xl:26px;--t-hero:clamp(40px,8vw,68px);--t-num:clamp(96px,22vw,168px);
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:2px}
@media(prefers-color-scheme:dark){:root{--bg:#14130f;--surface:#1c1a15;--fg:#efe9da;--mut:#aaa38f;--faint:#7e7867;--line:#2e2b22;--line2:#443f31;--ink:#efe9da;--on-ink:#14130f;--warn:#2e260e;--warnb:#d9a21b;
 --applies:#4ade9b;--unknown:#f2b64a;--superseded:#b79cff;--future:#6cb6ff;--pending:#a0a0b4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--t-base)/1.6 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:0 var(--s5) var(--s7)}
#banner{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--on-ink);padding:var(--s2) var(--s4);font:var(--t-xs)/1.4 var(--mono);text-align:center;letter-spacing:.01em}
#banner b{font-weight:700}
h1{margin:var(--s7) 0 var(--s3);font:400 var(--t-hero)/1.02 var(--serif);letter-spacing:-.025em}
#tagline{margin:0 0 var(--s6);color:var(--mut);font:italic var(--t-lg)/1.45 var(--serif);max-width:30em}
form{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:end;border-top:2px solid var(--ink);border-bottom:1px solid var(--line2);padding:var(--s4) 0 var(--s5)}
label{display:flex;flex-direction:column;font:700 var(--t-xs)/1.2 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mut);gap:var(--s2)}
#addr{flex:1 1 300px}
input,button{font:inherit;font-size:var(--t-base);padding:11px 12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--fg)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--future);outline-offset:2px}
button{cursor:pointer;background:var(--ink);color:var(--on-ink);border-color:var(--ink);font:700 var(--t-sm)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:13px 20px}
button:hover{opacity:.85}
#examples{margin:var(--s4) 0 0;display:flex;gap:var(--s2);flex-wrap:wrap}
#examples button{background:transparent;color:var(--mut);border:1px dashed var(--line2);font:var(--t-xs)/1 var(--mono);letter-spacing:.02em;text-transform:none;font-weight:400;padding:7px 10px}
#examples button:hover{color:var(--fg);border-color:var(--fg);border-style:solid;opacity:1}
#note{font:var(--t-sm) var(--mono);color:var(--mut);margin:var(--s2) 0 0;min-height:1.2em}
/* the answer: one big number */
#verdict{margin:var(--s6) 0 var(--s5);display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s5);align-items:end;border-bottom:2px solid var(--ink);padding-bottom:var(--s5)}
#vnum{grid-row:1/3;font:400 var(--t-num)/.8 var(--serif);letter-spacing:-.05em;color:var(--applies);padding-top:var(--s3)}
#verdict.none #vnum{color:var(--faint)}
#vhead{text-transform:none;border:0;padding:0;color:var(--fg);margin:0;font:400 var(--t-xl)/1.15 var(--serif);letter-spacing:-.01em;align-self:end}
#vsub{margin:0;font:var(--t-sm)/1.5 var(--mono);color:var(--mut);align-self:start}
#asline{grid-column:1/-1;margin:var(--s4) 0 0;font:var(--t-xs)/1.5 var(--mono);color:var(--mut)}
.meta{font-size:var(--t-sm);color:var(--mut)}
#mt{font:var(--t-xs) var(--mono);color:var(--unknown);margin:var(--s4) 0 0}
#empty{background:var(--warn);border:1px solid var(--warnb);border-left-width:6px;border-radius:var(--r);padding:var(--s4);margin:var(--s5) 0;font-size:var(--t-base)}
h2{font:700 var(--t-xs)/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:var(--s6) 0 var(--s3);padding-top:var(--s3);border-top:1px solid var(--line2)}
#stack{list-style:none;margin:0;padding:0;display:grid;gap:0}
#stack li{border-bottom:1px solid var(--line);padding:var(--s3) 0;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:var(--t-base);align-items:baseline}
.lvl{font:var(--t-xs) var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--faint);min-width:84px}
.ovr{flex-basis:100%;font-size:var(--t-sm);color:var(--superseded);padding-left:100px}
.grp{margin:var(--s6) 0 var(--s4);font:400 var(--t-xl)/1.15 var(--serif);letter-spacing:-.01em;padding:0}
.grp.pending{color:var(--pending)}.grp.not_yet_effective{color:var(--future)}.grp.unknown{color:var(--unknown)}.grp.superseded{color:var(--superseded)}.grp.applies{color:var(--applies)}
/* cards: stamp first, rule second, citation third */
.rule{border-top:3px solid var(--line2);padding:var(--s4) 0 var(--s5);margin:0 0 var(--s2);background:transparent}
.rule.applies{border-top-color:var(--applies)}.rule.unknown{border-top-color:var(--unknown)}.rule.superseded{border-top-color:var(--superseded)}
.rule.not_yet_effective{border-top-color:var(--future)}.rule.pending{border-top-color:var(--pending)}
.badge{display:inline-block;font:700 var(--t-xs)/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;padding:5px 9px;border:2px solid currentColor;border-radius:var(--r);transform:rotate(-1.5deg)}
.applies .badge{color:var(--applies)}.unknown .badge{color:var(--unknown)}.superseded .badge{color:var(--superseded)}.not_yet_effective .badge{color:var(--future)}.pending .badge{color:var(--pending)}
.rule h3{margin:var(--s3) 0 var(--s1);font:400 var(--t-xl)/1.2 var(--serif);letter-spacing:-.01em}
.rule p{margin:var(--s3) 0 0;max-width:62ch}
.rule p.meta{margin-top:var(--s2)}
.src{margin-top:var(--s4);padding:var(--s3) 0 0 var(--s3);border-left:2px solid var(--line2);font:var(--t-xs)/1.5 var(--mono);color:var(--faint)}
.src .meta{font:var(--t-xs)/1.5 var(--mono);color:var(--faint);margin:0 0 var(--s1)}
.src a{color:var(--mut);text-underline-offset:3px}
blockquote{margin:var(--s2) 0 0;padding:0;font:italic var(--t-sm)/1.5 var(--serif);color:var(--mut)}
.flag{display:inline-block;margin-left:var(--s3);font:700 var(--t-xs) var(--mono);color:var(--warnb)}
#lang{padding:3px 8px;font:var(--t-xs) var(--mono);margin-left:var(--s2);background:transparent;color:var(--on-ink);border:1px solid var(--on-ink);text-transform:none;letter-spacing:0;font-weight:400}
[hidden]{display:none!important}
@media(max-width:560px){main{padding:0 var(--s4) var(--s6)}h1{margin-top:var(--s6)}#verdict{grid-template-columns:1fr}#vnum{grid-row:auto}.ovr{padding-left:0}}
</style>
<div id="banner" role="note"><b id="b1"></b> <span id="b2"></span> <button id="lang" type="button" aria-label="Language / Idioma"></button></div>
<main>
<h1 id="title">Rental Housing Law Navigator</h1><p id="tagline"></p>
<form id="f">
  <label id="addr">Address or address ID<input id="q" name="q" autocomplete="off" required placeholder="e.g. 6238 DE LONGPRE AVE or A0001"></label>
  <label>As of<input id="asof" type="date" value="2026-10-01"></label>
  <button>Look up</button>
</form>
<div id="examples"></div><div id="note" aria-live="polite"></div>
<section id="resultView" hidden>
  <p id="mt" hidden></p>
  <div id="verdict"><div id="vnum" aria-hidden="true"></div><h2 id="vhead"></h2><p id="vsub"></p><p id="asline" class="meta"></p></div>
  <div id="empty" hidden></div>
  <h2 id="h-stack"></h2><ul id="stack"></ul>
  <h2 id="h-rules"></h2><div id="rules"></div>
</section>
</main>
<script>
// Source order: live GET /api/lookup, else bundled fixtures (always labelled). No /api/chat.
const $ = (id) => document.getElementById(id);
// UI strings are fixed per language (never model output). Quoted spans and citations are always shown verbatim in English.
const I18N = {
  en: { b1: "Not legal advice.", b2: "Informational only; rules may be incomplete, out of date or misread. Check the cited source and consult a qualified professional.", mt: "",
    label: { applies: "Applies", unknown: "Unknown", superseded: "Superseded", not_yet_effective: "Not yet effective", pending: "Pending (not law)" },
    groups: { applies: "Enacted law: applies on this date", not_yet_effective: "Enacted law: not yet in effect", pending: "Pending bills: not law", superseded: "Superseded", unknown: "Unknown: cannot tell from our data", "": "Other" },
    vApplies: (n) => n === 1 ? "rule applies to this address" : "rules apply to this address", vNone: "No enacted rule in our data applies to this address on this date",
    vParts: { not_yet_effective: "not yet in effect", pending: "pending, not law", unknown: "unknown", superseded: "superseded" },
    asof: (d) => `As of ${d}. Enacted law and pending bills are listed separately by status.`, fixture: " Showing FIXTURE data, not real extracted rules.", addr: (a) => ` ${a.street_address}, ${a.postal_city} ${a.state}. Year built: ${a.year_built ?? "unknown"}; units: ${a.units ?? "unknown"}.`,
    stack: "Jurisdiction stack", rules: "Rules for this address", override: "Override: ", conflict: "⚑ possible conflict, human review", lowconf: (c) => `⚑ low confidence (${c}), verify against the source`,
    why: "Why: ", conflictNote: "Conflict: ", source: "Source: ", nocite: "missing citation", retrieved: (x) => ` · retrieved ${x}`, noretr: " · retrieval date not recorded", effective: "effective ", ifInForce: "In force only if: ", srcNote: "Source note: ",
    errPrefix: "Error. ", nc: "Unknown / not covered. ", ncMsg: "We cannot resolve this address, so no rules are shown rather than guessing.", none: "No rules in our data apply to this address. That is not a guarantee that none exist.",
    partial: "Partly covered, not everything is shown: ", looking: "Looking up…", fxnote: "Live lookup unavailable; showing bundled fixture data.", lookBtn: "Look up", asofLbl: "As of", addrLbl: "Address or address ID", other: "Español", untranslated: "" },
  es: { b1: "No es asesoría legal.", b2: "Solo informativo; las reglas pueden estar incompletas, desactualizadas o mal interpretadas. Consulte la fuente citada y a un profesional calificado.", mt: "Traducción automática; el texto legal original prevalece",
    label: { applies: "Aplica", unknown: "Desconocido", superseded: "Reemplazada", not_yet_effective: "Aún no en vigor", pending: "Pendiente (no es ley)" },
    groups: { applies: "Ley vigente: aplica en esta fecha", not_yet_effective: "Ley promulgada: aún no en vigor", pending: "Proyectos pendientes: no son ley", superseded: "Reemplazadas", unknown: "Desconocido: no se puede determinar con nuestros datos", "": "Otras" },
    vApplies: (n) => n === 1 ? "regla aplica a esta dirección" : "reglas aplican a esta dirección", vNone: "Ninguna ley vigente en nuestros datos aplica a esta dirección en esta fecha",
    vParts: { not_yet_effective: "aún no en vigor", pending: "pendientes, no son ley", unknown: "desconocidas", superseded: "reemplazadas" },
    asof: (d) => `Al ${d}. La ley vigente y los proyectos pendientes se muestran por separado según su estado.`, fixture: " Mostrando datos de PRUEBA, no reglas extraídas reales.", addr: (a) => ` ${a.street_address}, ${a.postal_city} ${a.state}. Año de construcción: ${a.year_built ?? "desconocido"}; unidades: ${a.units ?? "desconocido"}.`,
    stack: "Jurisdicciones aplicables", rules: "Reglas para esta dirección", override: "Prevalece: ", conflict: "⚑ posible conflicto, requiere revisión humana", lowconf: (c) => `⚑ baja confianza (${c}), verifique con la fuente`,
    why: "Por qué: ", conflictNote: "Conflicto: ", source: "Fuente (en inglés): ", nocite: "falta la cita", retrieved: (t) => ` · consultada ${t}`, noretr: " · fecha de consulta no registrada", effective: "vigente desde ", ifInForce: "En vigor solo si: ", srcNote: "Nota sobre la fuente (en inglés): ",
    errPrefix: "Error. ", nc: "Desconocido / no cubierto. ", ncMsg: "No podemos resolver esta dirección, así que no mostramos reglas en lugar de adivinar.", none: "Ninguna regla en nuestros datos aplica a esta dirección. Eso no garantiza que no existan.",
    partial: "Cobertura parcial, no se muestra todo: ", looking: "Buscando…", fxnote: "Búsqueda en vivo no disponible; mostrando datos de prueba.", lookBtn: "Buscar", asofLbl: "Fecha", addrLbl: "Dirección o ID de dirección", other: "English", untranslated: " (sin traducir)" },
};
let LANG = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "en";
const T = () => I18N[LANG];
let es = null; // optional public/es.json: { team_rule_id: { requirement, explanation } } — machine translation of the plain-language summary only
const loadEs = () => es ? Promise.resolve(es) : fetch("es.json").then((r) => r.ok ? r.json() : {}).catch(() => ({})).then((j) => (es = j));
const LABEL = { applies: "Applies", unknown: "Unknown", superseded: "Superseded", not_yet_effective: "Not yet effective", pending: "Pending (not law)" };
const FALLBACK = { title: "Rental Housing Law Navigator", tagline: "Which housing rules apply to this address on a given date? Not legal advice.", examples: ["6238 DE LONGPRE AVE", "1031-1035 CLINTON ST"] };
const FIXTURES_ON = new URLSearchParams(location.search).get("fixtures") === "1";
let fixtures = null;
const loadFixtures = () => fixtures ? Promise.resolve(fixtures) : fetch("fixtures/lookup-fixtures.json").then((r) => r.ok ? r.json() : null).catch(() => null).then((j) => (fixtures = j));

function applyConfig(c) {
  document.title = $("title").textContent = c.title; $("tagline").textContent = c.tagline;
  $("examples").replaceChildren(...(c.examples || []).map((ex) => { const b = document.createElement("button"); b.type = "button"; b.textContent = ex; b.onclick = () => { $("q").value = ex; $("f").requestSubmit(); }; return b; }));
}
fetch("/api/config").then((r) => { if (!r.ok) throw 0; return r.json(); }).then(applyConfig).catch(() => applyConfig(FALLBACK));

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// Fixture mode only: enacted-but-future rules are shown as not_yet_effective for the chosen date.
function statusFor(r, asof) {
  if (r.result === "applies" && r.rule?.effective_date && r.rule.effective_date.length === 10 && r.rule.effective_date > asof) return "not_yet_effective";
  return r.result;
}

async function lookup(address, asof) {
  try {
    const r = await fetch("/api/lookup?" + new URLSearchParams({ address, asof }));
    if (r.ok) return { data: await r.json(), source: "live" };
    // A 404 only means "address not covered" when the API itself answered with JSON; a static host's HTML 404 means no backend.
    if (r.status === 404 && (r.headers.get("content-type") || "").includes("json")) return { data: { not_covered: true, message: (await r.json().catch(() => ({}))).error || "Address not found." }, source: "live" };
  } catch {}
  // Placeholder fixtures are opt-in (?fixtures=1) so a failed fetch can never pass fixture law off as real in a demo or the judged deployment.
  if (!FIXTURES_ON) return { data: { error: true, message: "The lookup service is unavailable, so no rules can be shown. Try again; this is not a finding that no rules apply." }, source: "live" };
  const fx = await loadFixtures();
  const key = address.trim().toUpperCase();
  const hit = fx && Object.entries(fx.addresses).find(([id, v]) => id === key || v.address.street_address.toUpperCase() === key);
  if (!hit) return { data: { not_covered: true, message: fx ? "No data for this address in the bundled fixtures." : "No backend and no fixtures reachable." }, source: "fixture" };
  const d = structuredClone(hit[1]);
  d.results.forEach((r) => { r.result = statusFor(r, asof); });
  d.as_of = asof;
  return { data: d, source: "fixture" };
}

let last = null;
function render(res, asof) {
  last = [res, asof]; const { data: d, source } = res, t = T();
  $("resultView").hidden = false;
  $("asline").textContent = t.asof(d.as_of || asof) + (source === "fixture" ? t.fixture : "");
  const empty = $("empty"), stack = $("stack"), rules = $("rules"), verdict = $("verdict");
  stack.replaceChildren(); rules.replaceChildren();
  // Live API sends not_covered as an ARRAY of uncovered scopes ([] = fully covered); the 404 path sends boolean true.
  const ncList = Array.isArray(d.not_covered) ? d.not_covered : [];
  if (d.not_covered === true || !d.results) {
    verdict.hidden = true;
    empty.hidden = false; empty.textContent = (d.error ? t.errPrefix : t.nc) + (LANG === "en" && d.message || t.ncMsg);
    return;
  }
  verdict.hidden = false;
  const counts = {}; for (const r of d.results) counts[r.result] = (counts[r.result] || 0) + 1;
  const nApplies = counts.applies || 0;
  $("vnum").textContent = nApplies; $("vhead").textContent = nApplies ? t.vApplies(nApplies) : t.vNone;
  verdict.classList.toggle("none", !nApplies);
  $("vsub").textContent = Object.keys(t.vParts).filter((k) => counts[k]).map((k) => `${counts[k]} ${t.vParts[k]}`).join(" · ");
  $("vsub").hidden = !$("vsub").textContent;
  empty.hidden = !ncList.length;
  if (ncList.length) empty.textContent = t.partial + ncList.join("; ");
  const a = d.address;
  if (a) $("asline").textContent += t.addr(a);
  for (const s of d.stack || []) {
    const li = el("li"); li.append(el("span", "lvl", s.level), el("b", null, s.name));
    if (s.note) li.append(el("span", "ovr", t.override + s.note));
    stack.append(li);
  }
  if (!d.results.length) { rules.append(el("p", null, t.none)); return; }
  const known = new Set(["applies", "not_yet_effective", "pending", "superseded", "unknown"]);
  for (const key of [...known, ""]) { const title = t.groups[key];
    const part = d.results.filter((r) => (known.has(r.result) ? r.result : "") === key);
    if (!part.length) continue;
    rules.append(el("h3", "grp " + key, `${title} (${part.length})`));
    for (const r of part) rules.append(card(r));
  }
}

function card(r) {
  {
    const t = T(), rule = r.rule || {}, c = el("article", "rule " + r.result), tr = LANG === "es" ? (es?.[r.team_rule_id] || {}) : {};
    const head = el("div"); head.append(el("span", "badge", t.label[r.result] || r.result));
    if (r.conflict_flag || rule.conflict_flag) head.append(el("span", "flag", t.conflict));
    const conf = r.confidence ?? rule.confidence;
    if (typeof conf === "number" && conf < 0.7) head.append(el("span", "flag", t.lowconf(conf)));
    c.append(head, el("h3", null, rule.title || r.team_rule_id));
    c.append(el("div", "meta", [rule.jurisdiction, rule.category?.replaceAll("_", " "), rule.effective_date && t.effective + rule.effective_date].filter(Boolean).join(" · ")));
    if (rule.requirement) c.append(el("p", null, LANG === "es" ? (tr.requirement || rule.requirement + t.untranslated) : rule.requirement));
    if (r.explanation) c.append(el("p", "meta", t.why + (LANG === "es" ? (tr.explanation || r.explanation + t.untranslated) : r.explanation)));
    if (rule.conflict_note) c.append(el("p", "meta", t.conflictNote + rule.conflict_note));
    if (r.if_in_force?.explanation) c.append(el("p", "meta if-in-force", t.ifInForce + r.if_in_force.explanation + t.untranslated));
    const src = el("div", "src");
    const cite = el("div", "meta"); cite.append(t.source);
    if (rule.source_url && /^https?:/.test(rule.source_url)) { const l = el("a", null, rule.citation || rule.source_url); l.href = rule.source_url; l.target = "_blank"; l.rel = "noopener"; cite.append(l); }
    else cite.append(rule.citation || "missing citation");
    cite.append(rule.retrieved_at ? t.retrieved(rule.retrieved_at) : t.noretr);
    src.append(cite);
    const sn = r.source_note || rule.source_note; // where this rule's text came from; shown verbatim, English only
    if (sn) src.append(el("p", "meta source-note", t.srcNote + sn));
    if (rule.quoted_span) src.append(el("blockquote", null, rule.quoted_span));
    c.append(src);
    return c;
  }
}

async function setLang(l) {
  LANG = l; const t = T(); document.documentElement.lang = l;
  if (l === "es") await loadEs();
  $("b1").textContent = t.b1; $("b2").textContent = t.b2; $("lang").textContent = t.other;
  $("mt").textContent = t.mt; $("mt").hidden = !t.mt;
  $("h-stack").textContent = t.stack; $("h-rules").textContent = t.rules;
  $("f").querySelector("button:not(#lang)").textContent = t.lookBtn;
  $("addr").firstChild.textContent = t.addrLbl; $("asof").parentNode.firstChild.textContent = t.asofLbl;
  if (last) render(...last);
}
$("lang").onclick = () => setLang(LANG === "en" ? "es" : "en");
setLang(LANG);

$("f").onsubmit = async (e) => {
  e.preventDefault();
  $("note").textContent = T().looking;
  const asof = $("asof").value || "2026-10-01";
  const res = await lookup($("q").value, asof);
  $("note").textContent = res.source === "fixture" ? T().fxnote : "";
  render(res, asof);
};
</script>
